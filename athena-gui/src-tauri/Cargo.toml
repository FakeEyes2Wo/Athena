[package]
name = "athena-gui"
version = "0.1.0"
description = "Athena GUI - AI4ML Pipeline Builder"
authors = ["Athena Team"]
edition = "2021"

[lib]
name = "athena_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
