<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/athena-logo-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/athena-logo-dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Athena — 对话式自动机器学习研究工作台" />
    <title>Athena</title>
    <script>
      // Resolve the theme before first paint (mirrors src/hooks/useTheme.ts) so
      // dark-mode users don't see a light flash while the bundle loads.
      try {
        var t = localStorage.getItem("athena-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
