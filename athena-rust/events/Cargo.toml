[package]
name = "events"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "time", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
