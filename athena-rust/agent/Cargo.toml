[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
core = { path = "../core" }
tool = { path = "../tool" }
memory = { path = "../memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
