[package]
name = "memory"
version = "0.1.0"
edition = "2024"

[dependencies]
core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt"] }
chrono = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
