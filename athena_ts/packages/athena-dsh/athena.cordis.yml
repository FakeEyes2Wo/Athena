# Athena + AutoResearch preset（DSH agent 组合片段，供 base/web 组合 include）

# 挂载方式：把本文件的 Athena/AutoResearch 行并入 DSH 的 agent preset（或作为独立 preset）。
# 研究域 Service 全部按 entry-local realm 隔离，避免跨 session 共享可变实例。

- id: athena-research
  name: cordis:group
  group: true
  isolate:
    researchStore: true
    researchTree: true
    researchState: true
    researchScheduler: true
    researchEvaluator: true
    researchScriptRunner: true
    researchGit: true
    researchSupervisor: true
    autoResearchSpec: true
    autoResearchStateStore: true
    hypothesisPool: true
    autoResearchGateRunner: true
    autoResearchProviders: true
    autoResearchStages: true
    autoResearchRuntime: true
  config:
    - id: research-services
      name: '@athena/dsh'
      config:
        projectRoot: '{{cwd}}'
        searchLimit: 10
        concurrency: 4
        direction: maximize
        tolerance: 0.0
    - id: autoresearch-services
      name: '@athena/autoresearch'
      config:
        projectRoot: '{{cwd}}'
        runSpec:
          run_id: ar_dsh
          budgets:
            max_ideas: 20
            max_experiments: 10
            max_paper_rounds: 5
            max_tokens: 0
            project_time_limit: PT12H
