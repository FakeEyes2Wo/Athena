[project]
name = "athena-ai4s"
version = "0.1.0"
description = "Skeleton for the Athena automated AI4S system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.48.0",
    "pydantic>=2.0",
    "pydantic-ai>=2.17.0",
    "python-dotenv>=1.0",
    "pylatexenc>=2.10",
    "pymupdf>=1.24",
    "huggingface_hub>=0.20",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pre-commit>=4.6.0,<5",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py311"]
