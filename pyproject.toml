[project]
name = "athena-ai4s"
version = "0.1.0"
description = "Skeleton for the Athena automated AI4S system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.14",
    "langchain-anthropic>=1.4.8",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["test"]
