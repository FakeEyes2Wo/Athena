[project]
name = "athena-ai4s"
version = "0.1.0"
description = "Skeleton for the Athena automated AI4S system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.48.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-ai>=2.17.0",
    "python-dotenv>=1.0",
    "pylatexenc>=2.10",
    "pymupdf>=1.24",
    "scipy>=1.14.0",
    "websockets>=14.0",
    "qoder-agent-sdk==1.0.12",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pre-commit>=4.6.0,<5",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena", "src/gui_gateway"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["test", "tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (deselect with '-m not slow')"]

[tool.black]
line-length = 88
target-version = ["py311"]
