[project]
name = "athena-ai4s"
version = "0.1.0"
description = "Skeleton for the Athena automated AI4S system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "markitdown[pdf]>=0.1.6",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["test"]
