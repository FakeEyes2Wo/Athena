[project]
name = "athena-ai4s"
version = "0.1.0"
description = "Skeleton for the Athena automated AI4S system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "huggingface_hub>=0.20",
    "matplotlib>=3.11.1",
    "mcp>=1.0.0",
    "openai>=2.48.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-ai>=2.17.0",
    "pylatexenc>=2.10",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "websockets>=14.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pre-commit>=4.6.0,<5",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena", "src/gui_gateway"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["test", "tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services or real API access",
    "slow: marks tests as slow (deselect with '-m not slow')",
]

[tool.black]
line-length = 88
target-version = ["py311"]
